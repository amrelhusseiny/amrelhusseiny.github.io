<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Portfolio</title>
    <!-- Bulma CSS Framework CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .content-wrapper {
            flex: 1;
        }
        .hero-body {
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Simple Navigation -->
    <nav class="navbar is-light" role="navigation" aria-label="main navigation">
        <div class="navbar-brand">
            <a class="navbar-item" href="/">
                &larr; Back to Main Blog
            </a>
            <div class="navbar-item">
                <strong>Design Space</strong>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero is-primary is-medium">
        <div class="hero-body">
            <div class="container">
                <h1 class="title">
                    Welcome to My Design Space
                </h1>
                <h2 class="subtitle">
                    A collection of flat, simple designs and experiments.
                </h2>
            </div>
        </div>
    </section>

    <!-- Content Section -->
    <section class="section content-wrapper">
        <div class="container">
            <div class="columns is-multiline">
                <!-- Example Card 1 -->
                <div class="column is-one-third">
                    <div class="card">
                        <header class="card-header">
                            <p class="card-header-title">
                                Project Template
                            </p>
                        </header>
                        <div class="card-content">
                            <div class="content">
                                This is the base template used for creating new design pages.
                                <br>
                            </div>
                        </div>
                        <footer class="card-footer">
                            <a href="template.html" class="card-footer-item">View Template</a>
                        </footer>
                    </div>
                </div>

                <!-- Placeholder for more cards -->
                <div class="column is-one-third">
                    <div class="card">
                        <header class="card-header">
                            <p class="card-header-title">
                                Coming Soon
                            </p>
                        </header>
                        <div class="card-content">
                            <div class="content">
                                More designs will be added here soon.
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="content has-text-centered">
            <p>
                <strong>Design Subsite</strong> by Amro Elhusseini.
            </p>
        </div>
    </footer>

</body>
</html>
