<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Page Template</title>
    <!-- Bulma CSS Framework CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <style>
        /* Custom styles to ensure a flat, simple design */
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .content-wrapper {
            flex: 1;
        }
        footer {
            padding: 2rem 1.5rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Simple Navigation (Optional: You can link back to main site here) -->
    <nav class="navbar is-light" role="navigation" aria-label="main navigation">
        <div class="navbar-brand">
            <a class="navbar-item" href="/">
                <strong>Main Blog</strong>
            </a>
            <a class="navbar-item" href="/design">
                <strong>Design Home</strong>
            </a>
        </div>
    </nav>

    <!-- Main Content Section -->
    <section class="section content-wrapper">
        <div class="container">
            <h1 class="title">
                Page Title
            </h1>
            <p class="subtitle">
                A simple subtitle for this page.
            </p>

            <div class="content">
                <p>
                    This is a blank template using Bulma. You can copy this file to create new pages with unique designs.
                </p>
                <!-- Add your unique page content here -->
            </div>
        </div>
    </section>

    <!-- Simple Footer -->
    <footer class="footer">
        <div class="content has-text-centered">
            <p>
                <strong>Design Subsite</strong> by Amro Elhusseini.
            </p>
        </div>
    </footer>

</body>
</html>
