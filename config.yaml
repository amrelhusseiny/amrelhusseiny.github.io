# config.yaml
# baseURL: http://localhost:1313/
baseURL: https://amrelhusseiny.github.io/
buildDrafts: false
theme: "m10c"
title: "Amro's Blog"
languageCode: "en-us"
publishDir: "docs"
pagination:
  pagerSize: 50


module:
  hugoVersion:
    extended: true

params:
  author: Amro
  avatar: "/avatar.png"
  description: Network engineer and automation advocate. Writing about networks, Linux, AI, and automation.
  menu_item_separator: "<br>"
  favicon: "favicon.ico"
  social:
    - icon: "github"
      name: "amrelhusseiny Github"
      url: "https://github.com/amrelhusseiny"
    - icon: "linkedin"
      name: "amrelhusseiny linkedin"
      url: "https://www.linkedin.com/in/amro-elhusseini-2a330456"

  style:
    darkestColor: "#ffffff"
    darkColor: "#ffffff"
    lightColor: "#353b43"
    lightestColor: "#242930"
    primaryColor: "#666666"



markup:
  goldmark:
    renderer:
      # Enabled to embed HTML Code into markdown
      unsafe: true
  highlight:
    noClasses: false      # use CSS classes (not inline styles) — enables light/dark theming
    codeFences: true      # process fenced code blocks
    guessSyntax: false    # manual language tags only — no guessing
    lineNos: false        # no line numbers
    style: monokai        # base style (overridden by our CSS classes)

uglyURLs: false

mediaTypes:
  text/plain:
    suffixes:
      - txt

outputFormats:
  llmstxt:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true
  llmsfull:
    mediaType: text/plain
    baseName: llms-full
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - HTML
    - RSS
    - llmstxt
    - llmsfull
  page:
    - HTML
    - markdown
  section:
    - HTML
    - RSS

menu:
  main:
    - identifier: "Technical Blog"
      name: "Blog"
      url: "/blog"
    - identifier: "About"
      name: "About"
      url: "/about"
