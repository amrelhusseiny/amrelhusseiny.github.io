# config.yaml
# baseURL: http://localhost:1313/
baseURL: https://amrelhusseiny.github.io/
buildDrafts: false
theme: "m10c"
title: "Amro's Blog"
languageCode: "en-us"
publishDir: "docs"
pagination:
  pagerSize: 50


module:
  hugoVersion:
    extended: true

params:
  author: Sam7oon
  avatar: "https://github.com/amrelhusseiny.png"
  description: Network engineer and Automation advocate
  menu_item_separator: "<br>"
  favicon: "favicon.ico"
  social:
    - icon: "github"
      name: "amrelhusseiny Github"
      url: "https://github.com/amrelhusseiny"
    - icon: "linkedin"
      name: "amrelhusseiny linkedin"
      url: "https://www.linkedin.com/in/amr-abd-el-halim-2a330456"

  style:
    darkestColor: "#ffffff"
    darkColor: "#ffffff"
    lightColor: "#353b43"
    lightestColor: "#242930"
    primaryColor: "#666666"



markup:
  goldmark:
    renderer:
      # Enabled to embed HTML Code into markdown
      unsafe: true

uglyURLs: false



menu:
  main:
    - identifier: "Technical Blog"
      name: "Blog"
      url: "/blog"
    - identifier: "About"
      name: "About"
      url: "/About"
