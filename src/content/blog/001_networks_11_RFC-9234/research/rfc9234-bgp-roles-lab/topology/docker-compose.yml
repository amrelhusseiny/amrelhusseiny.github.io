# RFC 9234 SHOWCASE LAB - single combined topology, 12 nodes.
# Covers ALL 5 valid RFC 9234 role pairings (up) PLUS the rejected/mismatch cases (down):
#
# VALID (Established):
#   peer1-peer      <-> provider1  (Peer/Peer)
#   provider1       <-> customer1  (Provider/Customer)
#   customer1       <-> provider2  (Customer/Provider)
#   rs1             <-> rsclient1  (RS-Server/RS-Client)
#   rs1             <-> rsclient2  (RS-Server/RS-Client)
#
# REJECTED (Role Mismatch, code 2 subcode 11):
#   m1 (peer)       <-> provider1  (Provider/Peer invalid)
#   m2 (provider)   <-> peer1      (Peer/Provider invalid)
#   m3 (peer)       <-> rs1        (RS-Server/Peer invalid)
#   m4 (customer)   <-> customer1  (Customer/Customer invalid)
#
# REJECTED (strict-mode):
#   m5 (no role)    <-> provider1 strict-mode

services:
  peer1:
    image: frrouting/frr:latest
    container_name: rfc9234-peer1
    hostname: peer1
    cap_add: [NET_ADMIN, SYS_ADMIN]
    volumes:
      - ../configs/peer1:/etc/frr
    networks:
      net-peer1-provider1:
        ipv4_address: 10.0.1.3
      net-peer1-m2:
        ipv4_address: 10.0.6.2

  provider1:
    image: frrouting/frr:latest
    container_name: rfc9234-provider1
    hostname: provider1
    cap_add: [NET_ADMIN, SYS_ADMIN]
    volumes:
      - ../configs/provider1:/etc/frr
    networks:
      net-peer1-provider1:
        ipv4_address: 10.0.1.2
      net-provider1-customer1:
        ipv4_address: 10.0.2.2
      net-provider1-m1:
        ipv4_address: 10.0.5.2
      net-provider1-m5:
        ipv4_address: 10.0.9.2

  customer1:
    image: frrouting/frr:latest
    container_name: rfc9234-customer1
    hostname: customer1
    cap_add: [NET_ADMIN, SYS_ADMIN]
    volumes:
      - ../configs/customer1:/etc/frr
    networks:
      net-provider1-customer1:
        ipv4_address: 10.0.2.3
      net-customer1-provider2:
        ipv4_address: 10.0.3.2
      net-customer1-m4:
        ipv4_address: 10.0.8.2

  provider2:
    image: frrouting/frr:latest
    container_name: rfc9234-provider2
    hostname: provider2
    cap_add: [NET_ADMIN, SYS_ADMIN]
    volumes:
      - ../configs/provider2:/etc/frr
    networks:
      net-customer1-provider2:
        ipv4_address: 10.0.3.3

  rs1:
    image: frrouting/frr:latest
    container_name: rfc9234-rs1
    hostname: rs1
    cap_add: [NET_ADMIN, SYS_ADMIN]
    volumes:
      - ../configs/rs1:/etc/frr
    networks:
      net-ix-rs:
        ipv4_address: 10.0.4.2
      net-rs1-m3:
        ipv4_address: 10.0.7.2

  rsclient1:
    image: frrouting/frr:latest
    container_name: rfc9234-rsclient1
    hostname: rsclient1
    cap_add: [NET_ADMIN, SYS_ADMIN]
    volumes:
      - ../configs/rsclient1:/etc/frr
    networks:
      net-ix-rs:
        ipv4_address: 10.0.4.3

  rsclient2:
    image: frrouting/frr:latest
    container_name: rfc9234-rsclient2
    hostname: rsclient2
    cap_add: [NET_ADMIN, SYS_ADMIN]
    volumes:
      - ../configs/rsclient2:/etc/frr
    networks:
      net-ix-rs:
        ipv4_address: 10.0.4.4

  m1:
    image: frrouting/frr:latest
    container_name: rfc9234-m1
    hostname: m1
    cap_add: [NET_ADMIN, SYS_ADMIN]
    volumes:
      - ../configs/m1:/etc/frr
    networks:
      net-provider1-m1:
        ipv4_address: 10.0.5.3

  m2:
    image: frrouting/frr:latest
    container_name: rfc9234-m2
    hostname: m2
    cap_add: [NET_ADMIN, SYS_ADMIN]
    volumes:
      - ../configs/m2:/etc/frr
    networks:
      net-peer1-m2:
        ipv4_address: 10.0.6.3

  m3:
    image: frrouting/frr:latest
    container_name: rfc9234-m3
    hostname: m3
    cap_add: [NET_ADMIN, SYS_ADMIN]
    volumes:
      - ../configs/m3:/etc/frr
    networks:
      net-rs1-m3:
        ipv4_address: 10.0.7.3

  m4:
    image: frrouting/frr:latest
    container_name: rfc9234-m4
    hostname: m4
    cap_add: [NET_ADMIN, SYS_ADMIN]
    volumes:
      - ../configs/m4:/etc/frr
    networks:
      net-customer1-m4:
        ipv4_address: 10.0.8.3

  m5:
    image: frrouting/frr:latest
    container_name: rfc9234-m5
    hostname: m5
    cap_add: [NET_ADMIN, SYS_ADMIN]
    volumes:
      - ../configs/m5:/etc/frr
    networks:
      net-provider1-m5:
        ipv4_address: 10.0.9.3

networks:
  net-peer1-provider1:
    ipam:
      config:
        - subnet: 10.0.1.0/29
  net-provider1-customer1:
    ipam:
      config:
        - subnet: 10.0.2.0/29
  net-customer1-provider2:
    ipam:
      config:
        - subnet: 10.0.3.0/29
  net-ix-rs:
    ipam:
      config:
        - subnet: 10.0.4.0/29
  net-provider1-m1:
    ipam:
      config:
        - subnet: 10.0.5.0/29
  net-peer1-m2:
    ipam:
      config:
        - subnet: 10.0.6.0/29
  net-rs1-m3:
    ipam:
      config:
        - subnet: 10.0.7.0/29
  net-customer1-m4:
    ipam:
      config:
        - subnet: 10.0.8.0/29
  net-provider1-m5:
    ipam:
      config:
        - subnet: 10.0.9.0/29
