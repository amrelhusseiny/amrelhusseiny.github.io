log stdout
!
hostname provider1
!
interface lo
 ip address 100.64.3.3/32
!
router bgp 64503
 bgp router-id 100.64.3.3
 no bgp ebgp-requires-policy
 neighbor 10.0.1.3 remote-as 64502
 neighbor 10.0.1.3 local-role peer
 neighbor 10.0.2.3 remote-as 64504
 neighbor 10.0.2.3 local-role provider
 neighbor 10.0.5.3 remote-as 64701
 neighbor 10.0.5.3 local-role provider
 neighbor 10.0.9.3 remote-as 64705
 neighbor 10.0.9.3 local-role provider strict-mode
 !
 address-family ipv4 unicast
  neighbor 10.0.1.3 activate
  neighbor 10.0.2.3 activate
  neighbor 10.0.5.3 activate
  neighbor 10.0.9.3 activate
 exit-address-family
!
line vty
!
