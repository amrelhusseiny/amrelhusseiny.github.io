frr version 8.1
frr defaults traditional
hostname rc2
no ipv6 forwarding
!
! vm2 side (directly connected)
interface eth1
 ip address 10.10.20.1/30
!
! Path 1 (green) - ONLY active path, static
interface eth2
 ip address 10.20.13.2/30
!
! Path 0 (orange) - NOT configured (left unaddressed/down)
interface eth3
 no ip address
 shutdown
!
interface lo
 ip address 1.1.1.2/32
!
! Static routes via Path 1 next-hop R2 (10.20.13.1)
ip route 10.10.10.0/30 10.20.13.1
ip route 10.20.11.0/30 10.20.13.1
ip route 10.20.12.0/30 10.20.13.1
!
line vty
!
