frr version 8.1
frr defaults traditional
hostname r4
no ipv6 forwarding
!
! Path 0 NOT configured - interfaces left unaddressed/down.
interface eth1
 no ip address
 shutdown
!
interface eth2
 no ip address
 shutdown
!
interface lo
 ip address 1.1.1.14/32
!
! No static routes - Path 0 disabled.
line vty
!
