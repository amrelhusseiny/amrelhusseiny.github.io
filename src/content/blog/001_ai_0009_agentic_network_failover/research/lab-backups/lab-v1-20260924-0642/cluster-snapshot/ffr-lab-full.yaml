      #!/bin/sh
      echo "=== VM2 Starting ==="
      apk add --no-cache openssh openssh-client iproute2 iputils curl 2>/dev/null || true
      ip addr flush dev eth0 2>/dev/null || true
      ip addr add 172.16.139.45/32 dev eth0 2>/dev/null || true
      ip link set eth0 up 2>/dev/null || true
      # Default via RC2
      ip route add default via 169.254.1.1 dev eth0 2>/dev/null || true
      echo "VM2 configured (IP 172.16.139.45, GW 172.16.139.47)"
      ip addr show eth0 2>/dev/null || echo "eth0 missing"
      echo "Starting SSH server..."
      ssh-keygen -A 2>/dev/null || true
      mkdir -p /run/sshd
      echo 'root:labpass' | chpasswd
      /usr/sbin/sshd
      echo "SSH server started"
      sleep infinity
