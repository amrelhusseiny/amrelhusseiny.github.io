  data:
    start.sh: |
      #!/bin/sh
      echo "=== VM1 Starting ==="
      apk add --no-cache openssh openssh-client iproute2 iputils curl 2>/dev/null || true
      ip addr flush dev eth0 2>/dev/null || true
      ip addr add 172.16.3.106/32 dev eth0 2>/dev/null || true
      ip link set eth0 up 2>/dev/null || true
      # Default via RC1
      ip route add default via 169.254.1.1 dev eth0 2>/dev/null || true
      echo "VM1 configured (IP 172.16.3.106, GW 172.16.3.107)"
      ip addr show eth0 2>/dev/null || echo "eth0 missing"
