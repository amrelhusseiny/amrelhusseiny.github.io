w-window -t lab -n clients\ntmux split-window -h -t lab:clients\ntmux select-layout -t lab:clients even-horizontal\ntmux send-keys -t lab:clients.0 \"$LOGIN root@vm1-svc\" Enter\ntmux send-keys -t lab:clients.1 \"$LOGIN root@vm2-svc\" Enter\ntmux select-window -t lab:routers\necho \"tmux session 'lab' started (routers + clients, auto-login via DNS)\"\nsleep infinity\n"},"kind":"ConfigMap","metadata":{"annotations":{},"name":"ssh-server-config","namespace":"ffr-lab"}}
