# FRR static configs — PATH 1 ONLY. No OSPF anywhere.
# Tunnel IPs mirror the containerlab IP plan:
#   vm1 10.1.1.1 <-> rc1 10.1.1.254 | rc1-r1 10.1.2.0/24 | r1-r2 10.1.3.0/24
#   r2-rc2 10.1.4.0/24 | rc2 10.1.8.254 <-> vm2 10.1.8.1
# Path 0 (10.1.5/6/7, r3/r4) is unconfigured; r3/r4 are scaled to 0.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rc1-frr
  namespace: ffr-lab
data:
  frr.conf: |
    frr version 10.0
    frr defaults traditional
    hostname rc1
    log syslog informational
    service integrated-vtysh-config
    !
    interface gre-vm1
     ip address 10.1.1.254/24
    !
    interface gre-r1
     ip address 10.1.2.1/24
    !
    ip route 10.1.3.0/24 10.1.2.2
    ip route 10.1.4.0/24 10.1.2.2
    ip route 10.1.8.0/24 10.1.2.2
    !
    line vty
    !
---
