        {"apiVersion":"v1","data":{"start.sh":"#!/bin/sh\necho \"=== $NODE starting (pod IP $POD_IP) ===\"\napk add --no-cache openssh-server openssh-client iproute2 iputils bind-tools 2\u003e\u00261 | tail -1 || true\nssh-keygen -A \u003e/dev/null 2\u003e\u00261 || true\nmkdir -p /run/sshd\necho 'root:labpass' | chpasswd 2\u003e/dev/null || true\ngrep -q '^PermitRootLogin' /etc/ssh/sshd_config 2\u003e/dev/null || echo 'PermitRootLogin yes' \u003e\u003e /etc/ssh/sshd_config\n/usr/sbin/sshd 2\u003e/dev/null || true\nsysctl -w net.ipv4.ip_forward=1 2\u003e/dev/null || echo 1 \u003e /proc/sys/net/ipv4/ip_forward 2\u003e/dev/null || true\nresolve() {\n  i=0\n  while [ $i -lt 60 ]; do\n    ip=$(getent hosts \"$1\" | awk '{print $1}' | head -n1)\n    if [ -n \"$ip\" ]; then echo \"$ip\"; return 0; fi\n    sleep 2; i=$((i+1))\n  done\n  echo \"FAILED to resolve $1\" \u003e\u00262; return 1\n}\nfor t in $TUN; do\n  name=${t%%:*}; svc=${t##*:}\n  peer=$(resolve \"$svc\") || exit 1\n  echo \"tunnel $name: local=$POD_IP remote=$peer ($svc)\"\n  ip tunnel add \"$name\" mode gre remote \"$peer\" local \"$POD_IP\" ttl 255 2\u003e/dev/null || \\\n    ip tunnel change \"$name\" mode gre remote \"$peer\" local \"$POD_IP\" ttl 255\n  ip link set \"$name\" mtu 1400 up\ndone\n# Install FRR config (ConfigMap is mounted at /config; /etc/frr stays writable)\ncp /config/frr.conf /etc/frr/frr.conf\ncat \u003e /etc/frr/daemons \u003c\u003c'EOF'\nzebra=yes\nbgpd=no\nospfd=yes\nospf6d=no\nripd=no\nripngd=no\nisisd=no\npimd=no\nldpd=no\nnhrpd=no\neigrpd=no\nbabeld=no\nsharpd=no\npbrd=no\nbfdd=no\nfabricd=no\nvrrpd=no\npathd=no\npim6d=no\nstaticd=yes\nmgmtd=no\nwatchfrr_options=\"--daemon\"\nEOF\necho 'service integrated-vtysh-config' \u003e /etc/frr/vtysh.conf\nmkdir -p /var/run/frr /var/log/frr\nchown -R frr:frr /etc/frr /var/run/frr /var/log/frr 2\u003e/dev/null || true\n/usr/lib/frr/frrinit.sh start\nsleep 5\necho \"--- gre interfaces ---\"\nip -4 addr show type gre || true\necho \"--- FRR static routes ---\"\nvtysh -c 'show ip route static' 2\u003e\u00261 || true\n# Self-heal GRE remotes: peer pod IPs change on every rollout/restart,\n# so refresh tunnel destinations in the background.\n(\nwhile true; do\n  sleep 30\n  for t in $TUN; do\n    name=${t%%:*}; svc=${t##*:}\n    peer=$(getent hosts \"$svc\" | awk '{print $1}' | head -n1)\n    if [ -n \"$peer\" ]; then\n      ip tunnel change \"$name\" mode gre remote \"$peer\" local \"$POD_IP\" ttl 255 2\u003e/dev/null || true\n    fi\n  done\ndone\n) \u0026\nsleep infinity\n"},"kind":"ConfigMap","metadata":{"annotations":{},"name":"router-start","namespace":"ffr-lab-ospf"}}
