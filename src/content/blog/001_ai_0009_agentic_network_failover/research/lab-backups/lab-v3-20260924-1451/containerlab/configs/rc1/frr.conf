frr version 8.1
frr defaults traditional
hostname rc1
no ipv6 forwarding
!
! vm1 side (directly connected)
interface eth1
 ip address 10.10.10.2/30
!
! Path 1 (green) - ONLY active path, static
interface eth2
 ip address 10.20.11.1/30
!
! Path 0 (orange) - NOT configured (left unaddressed/down)
interface eth3
 no ip address
 shutdown
!
interface lo
 ip address 1.1.1.1/32
!
! Static routes via Path 1 next-hop R1 (10.20.11.2)
ip route 10.20.12.0/30 10.20.11.2
ip route 10.20.13.0/30 10.20.11.2
ip route 10.10.20.0/30 10.20.11.2
!
line vty
!
