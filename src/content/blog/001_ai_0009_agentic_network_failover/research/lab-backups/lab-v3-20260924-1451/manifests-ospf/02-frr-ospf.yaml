# OSPF twin lab (namespace ffr-lab-ospf): same GRE topology as the static lab,
# but FRR OSPF area 0 with OUT-OF-BOX timers (hello 10s / dead 40s).
# Path 1 cost 10 (preferred), Path 0 cost 100 (automatic backup).
apiVersion: v1
kind: ConfigMap
metadata:
  name: rc1-frr
  namespace: ffr-lab-ospf
data:
  frr.conf: |
    frr version 10.0
    frr defaults traditional
    hostname rc1
    log syslog informational
    service integrated-vtysh-config
    !
    interface gre-vm1
     ip address 10.1.1.254/24
     ip ospf area 0.0.0.0
     ip ospf network point-to-point
    !
    interface gre-r1
     ip address 10.1.2.1/24
     ip ospf cost 10
     ip ospf area 0.0.0.0
     ip ospf network point-to-point
    !
    interface gre-r3
     ip address 10.1.5.1/24
     ip ospf cost 100
     ip ospf area 0.0.0.0
     ip ospf network point-to-point
    !
    router ospf
     ospf router-id 1.1.1.1
     network 10.1.1.0/24 area 0.0.0.0
     network 10.1.2.0/24 area 0.0.0.0
     network 10.1.5.0/24 area 0.0.0.0
    !
    line vty
    !
---
