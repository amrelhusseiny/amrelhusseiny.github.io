name: agent-lab

services:
  rc1:
    build: ./docker/router
    image: lab-router:latest
    container_name: agt-rc1
    hostname: rc1
    privileged: true
    environment:
      NODE: rc1
      IF_PA: "10.90.10.11"
      IF_PB: ""
      IF_PC: ""
      IF_ST: "10.90.20.11"
    volumes:
      - ./frr/agent/rc1.conf:/config/frr.conf:ro
      - ./frr/agent/daemons:/config/daemons:ro
    networks:
      pa:
        ipv4_address: 10.90.10.11
      st:
        ipv4_address: 10.90.20.11
  r1:
    build: ./docker/router
    image: lab-router:latest
    container_name: agt-r1
    hostname: r1
    privileged: true
    environment:
      NODE: r1
      IF_PA: "10.90.10.12"
      IF_PB: "10.90.11.13"
      IF_PC: ""
      IF_ST: ""
    volumes:
      - ./frr/agent/r1.conf:/config/frr.conf:ro
      - ./frr/agent/daemons:/config/daemons:ro
    networks:
      pa:
        ipv4_address: 10.90.10.12
      pb:
        ipv4_address: 10.90.11.13
  r2:
    build: ./docker/router
    image: lab-router:latest
    container_name: agt-r2
    hostname: r2
    privileged: true
    environment:
      NODE: r2
      IF_PA: ""
      IF_PB: "10.90.11.14"
      IF_PC: "10.90.12.15"
      IF_ST: ""
    volumes:
      - ./frr/agent/r2.conf:/config/frr.conf:ro
      - ./frr/agent/daemons:/config/daemons:ro
    networks:
      pb:
        ipv4_address: 10.90.11.14
      pc:
        ipv4_address: 10.90.12.15
  rc2:
    build: ./docker/router
    image: lab-router:latest
    container_name: agt-rc2
    hostname: rc2
    privileged: true
    environment:
      NODE: rc2
      IF_PA: ""
      IF_PB: ""
      IF_PC: "10.90.12.16"
      IF_ST: "10.90.20.14"
    volumes:
      - ./frr/agent/rc2.conf:/config/frr.conf:ro
      - ./frr/agent/daemons:/config/daemons:ro
    networks:
      pc:
        ipv4_address: 10.90.12.16
      st:
        ipv4_address: 10.90.20.14
  r3:
    build: ./docker/router
    image: lab-router:latest
    container_name: agt-r3
    hostname: r3
    privileged: true
    environment:
      NODE: r3
      IF_PA: ""
      IF_PB: ""
      IF_PC: ""
      IF_ST: "10.90.20.12"
    volumes:
      - ./frr/agent/r3.conf:/config/frr.conf:ro
      - ./frr/agent/daemons:/config/daemons:ro
    networks:
      st:
        ipv4_address: 10.90.20.12
  r4:
    build: ./docker/router
    image: lab-router:latest
    container_name: agt-r4
    hostname: r4
    privileged: true
    environment:
      NODE: r4
      IF_PA: ""
      IF_PB: ""
      IF_PC: ""
      IF_ST: "10.90.20.13"
    volumes:
      - ./frr/agent/r4.conf:/config/frr.conf:ro
      - ./frr/agent/daemons:/config/daemons:ro
    networks:
      st:
        ipv4_address: 10.90.20.13
  agent:
    build: ./docker/agent
    image: lab-agent:latest
    container_name: agt-agent
    hostname: agent
    env_file:
      - .env
    environment:
      ZEN_BASE: "https://opencode.ai/zen/v1"
      RC1_IP: 10.90.10.11
      R1_IP: 10.90.10.12
      R2_IP: 10.90.11.14
      RC2_IP: 10.90.12.16
      R3_IP: 10.90.20.12
      R4_IP: 10.90.20.13
    volumes:
      - ./agent:/agent
      - ./out:/agent/out
    working_dir: /agent
    command: ["sleep", "infinity"]
    networks:
      pa:
        ipv4_address: 10.90.10.30
      pb:
        ipv4_address: 10.90.11.30
      pc:
        ipv4_address: 10.90.12.30
      st:
        ipv4_address: 10.90.20.30

networks:
  pa:
    driver: bridge
    ipam:
      config:
        - subnet: 10.90.10.0/24
  pb:
    driver: bridge
    ipam:
      config:
        - subnet: 10.90.11.0/24
  pc:
    driver: bridge
    ipam:
      config:
        - subnet: 10.90.12.0/24
  st:
    driver: bridge
    ipam:
      config:
        - subnet: 10.90.20.0/24

