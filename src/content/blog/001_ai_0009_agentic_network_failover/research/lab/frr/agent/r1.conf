!
!
! r1 - transit router, PRIMARY path.
!
! AGENT LAB: static routes.
!
! PRIMARY : rc1 -> r1 -> r2 -> rc2   (distance 0, preferred)
! STANDBY : rc1 -> r3 -> rc2        (distance 200, configured but unused)
!
! Every next hop below is on one of this device's own segments, so nothing
! has to resolve recursively.
!
! Both paths exist from the start. Static routes do NOT fail over: with the
! primary dead, traffic keeps following distance 0 into the void even though
! a working standby is already configured. Something has to act.

ip forwarding
!
interface __PA__
 description PRIMARY segment PA
 ip address 10.90.10.12/24
 no ip redirects
 no ip receive-redirects
!
interface __PB__
 description PRIMARY segment PB
 ip address 10.90.11.13/24
 no ip redirects
 no ip receive-redirects
!
interface lo
 ip address 10.90.2.1/32
!
! ---- static routes ----
ip route 10.90.8.1/32 10.90.11.14
ip route 10.90.1.1/32 10.90.10.11
ip route 10.90.2.2/32 10.90.11.14
!
line vty

