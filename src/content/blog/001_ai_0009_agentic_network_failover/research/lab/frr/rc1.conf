!
! rc1 - client edge router. Client network 10.90.1.1/32 sits behind it.
!
! PRIMARY PATH : rc1 -> r1 -> r2 -> rc2
! STANDBY PATH : rc1 -> r3 -> r4 -> rc2
ip forwarding
!
interface eth0
 description uplink to rc1
 ip address 10.90.0.11/24
!
interface lo
 ip address 10.90.1.1/32
!
! ---- static routes (persisted in frr.conf, not poked in at runtime) ----
ip route 10.90.2.2/32 10.90.0.12
ip route 10.90.3.2/32 10.90.0.12
ip route 10.90.8.1/32 10.90.0.12
!
line vty

