!
!
! rc2 - server edge router. Server network sits behind it.
!
! OSPF LAB: single area 0.0.0.0.
!
! PRIMARY segments cost 10, STANDBY segment cost 100, so OSPF prefers the
! primary chain and keeps the standby installed as a genuine backup.

ip forwarding
!
interface __PC__
 description PRIMARY segment PC
 ip address 10.91.12.16/24
 no ip redirects
 no ip receive-redirects
 ip ospf cost 10
!
interface __ST__
 description STANDBY segment
 ip address 10.91.20.14/24
 no ip redirects
 no ip receive-redirects
 ip ospf cost 100
!
interface lo
 ip address 10.91.8.1/32
!
!
! ---- OSPF ----
router ospf
 ospf router-id 10.91.12.16
 network 10.91.12.0/24 area 0.0.0.0
 network 10.91.20.0/24 area 0.0.0.0
 network 10.91.8.1/32 area 0.0.0.0
!
line vty

