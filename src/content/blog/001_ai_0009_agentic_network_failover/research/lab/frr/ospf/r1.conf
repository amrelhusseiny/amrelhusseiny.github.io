!
!
! r1 - transit router, PRIMARY path.
!
! OSPF LAB: single area 0.0.0.0.
!
! PRIMARY segments cost 10, STANDBY segment cost 100, so OSPF prefers the
! primary chain and keeps the standby installed as a genuine backup.

ip forwarding
!
interface __PA__
 description PRIMARY segment PA
 ip address 10.91.10.12/24
 no ip redirects
 no ip receive-redirects
 ip ospf cost 10
!
interface __PB__
 description PRIMARY segment PB
 ip address 10.91.11.13/24
 no ip redirects
 no ip receive-redirects
 ip ospf cost 10
!
interface lo
 ip address 10.91.2.1/32
!
!
! ---- OSPF ----
router ospf
 ospf router-id 10.91.10.12
 network 10.91.10.0/24 area 0.0.0.0
 network 10.91.11.0/24 area 0.0.0.0
 network 10.91.2.1/32 area 0.0.0.0
!
line vty

