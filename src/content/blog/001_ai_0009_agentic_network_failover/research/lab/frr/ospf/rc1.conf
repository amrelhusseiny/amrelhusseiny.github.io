!
!
! rc1 - client edge router. Client network sits behind it.
!
! OSPF LAB: single area 0.0.0.0.
!
! PRIMARY segments cost 10, STANDBY segment cost 100, so OSPF prefers the
! primary chain and keeps the standby installed as a genuine backup.

ip forwarding
!
interface __PA__
 description PRIMARY segment PA
 ip address 10.91.10.11/24
 no ip redirects
 no ip receive-redirects
 ip ospf cost 10
!
interface __ST__
 description STANDBY segment
 ip address 10.91.20.11/24
 no ip redirects
 no ip receive-redirects
 ip ospf cost 100
!
interface lo
 ip address 10.91.1.1/32
!
!
! ---- OSPF ----
router ospf
 ospf router-id 10.91.10.11
 network 10.91.10.0/24 area 0.0.0.0
 network 10.91.20.0/24 area 0.0.0.0
 network 10.91.1.1/32 area 0.0.0.0
!
line vty

