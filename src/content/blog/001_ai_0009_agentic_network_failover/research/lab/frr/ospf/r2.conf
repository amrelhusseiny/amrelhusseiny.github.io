!
!
! r2 - transit router, PRIMARY path.
!
! OSPF LAB: single area 0.0.0.0.
!
! PRIMARY segments cost 10, STANDBY segment cost 100, so OSPF prefers the
! primary chain and keeps the standby installed as a genuine backup.

ip forwarding
!
interface __PB__
 description PRIMARY segment PB
 ip address 10.91.11.14/24
 no ip redirects
 no ip receive-redirects
 ip ospf cost 10
!
interface __PC__
 description PRIMARY segment PC
 ip address 10.91.12.15/24
 no ip redirects
 no ip receive-redirects
 ip ospf cost 10
!
interface lo
 ip address 10.91.2.1/32
!
!
! ---- OSPF ----
router ospf
 ospf router-id 10.91.11.14
 network 10.91.11.0/24 area 0.0.0.0
 network 10.91.12.0/24 area 0.0.0.0
 network 10.91.2.1/32 area 0.0.0.0
!
line vty

