# One monitoring deployment for BOTH labs. Attached to all eight lab networks
# so every node in either lab is reachable. Grafana and Prometheus bind to
# 127.0.0.1 only: reach them over an SSH tunnel, not over the corporate LAN.

name: monitoring

services:

  prometheus:
    image: prom/prometheus:latest
    container_name: mon-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=2h'
      - '--web.listen-address=0.0.0.0:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    ports:
      - '127.0.0.1:9090:9090'
    networks:
      - monitoring
      - agent-lab_pa
      - agent-lab_pb
      - agent-lab_pc
      - agent-lab_st
      - ospf-lab_pa
      - ospf-lab_pb
      - ospf-lab_pc
      - ospf-lab_st
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: mon-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks: [monitoring]
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: mon-promtail
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./promtail.yml:/etc/promtail/promtail.yml:ro
      - ../logs:/var/log/lab/frr:ro
      - ../agent-run.log:/var/log/lab/agent/agent-run.log:ro
      - ../out:/var/log/lab/agent/out:ro
      - promtail-positions:/positions
    depends_on: [loki]
    networks: [monitoring]
    restart: unless-stopped

  telegraf:
    image: telegraf:1.33.1
    container_name: mon-telegraf
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - ./metrics:/lab-metrics:ro
    command: ['--config', '/etc/telegraf/telegraf.conf']
    networks:
      - monitoring
      - agent-lab_pa
      - agent-lab_st
      - ospf-lab_pa
      - ospf-lab_st
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.2
    container_name: mon-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: lab
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: '5s'
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '127.0.0.1:3300:3000'
    depends_on: [prometheus, loki]
    networks: [monitoring]
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge
  agent-lab_pa: {external: true}
  agent-lab_pb: {external: true}
  agent-lab_pc: {external: true}
  agent-lab_st: {external: true}
  ospf-lab_pa: {external: true}
  ospf-lab_pb: {external: true}
  ospf-lab_pc: {external: true}
  ospf-lab_st: {external: true}

volumes:
  prom-data:
  loki-data:
  promtail-positions:
  grafana-data:
