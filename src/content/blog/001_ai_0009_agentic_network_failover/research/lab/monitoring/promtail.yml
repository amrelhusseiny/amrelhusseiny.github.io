# Promtail ships logs to Loki.
#
# The form that works here, after three wrong ones: the path goes in the
# __path__ LABEL and targets carries a dummy host. Promtail reads targets as
# host:port to scrape, so putting a path there makes it log "no path for
# target" and quietly tail nothing, while still looking healthy.
#
# Earlier attempts failed in ways worth remembering:
#   __path__: true            -> became the target KEY, tailed nothing
#   __path__ beside targets    -> not a schema field, config would not parse
#   __path_exglob__(...)       -> not supported by this 3.6 build
#   path in targets            -> treated as a host, same silent failure
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # FRR logs, one file per router, both labs. Device and lab are derived
  # from the filename so every line is filterable.
  - job_name: frr-logs
    static_configs:
      - targets: ['localhost']
        labels:
          __path__: /var/log/lab/frr/*/frr.log
          source: frr
    pipeline_stages:
      - template:
          source: '{{.filename}}'
      - regex:
          expression: '^/var/log/lab/frr/(?P<labdir>agt|ospf)-(?P<device>[a-z0-9]+)/frr\\.log$'
      - labels:
          device:
          labdir:
      - labeldrop:
          - filename
          - labdir

  # The agent live reasoning stream. Bind-mounted from the host so it fills
  # in while the agent works, not only at the end of a run.
  - job_name: agent-live
    static_configs:
      - targets: ['localhost']
        labels:
          __path__: /var/log/lab/agent/agent-run.log
          source: agent-live
          lab: agent

  # Every command the agent ran, from the run bundle, formatted as a log line
  # and labelled by device and by whether it was a configuration write.
  - job_name: agent-commands
    static_configs:
      - targets: ['localhost']
        labels:
          __path__: /var/log/lab/agent/out/*/trail/06-apply.ndjson
          source: agent-commands
          lab: agent
    pipeline_stages:
      - json:
          expressions:
            node: node
            mode: mode
            rc: rc
            command: command
      - template:
          source: '{{.mode}} {{.node}} rc={{.rc}}: {{.command}}'
      - labels:
          node:
          mode:
      - output:
          source: log
