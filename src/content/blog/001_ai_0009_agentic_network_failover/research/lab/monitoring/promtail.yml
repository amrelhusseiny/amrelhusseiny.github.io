# Promtail ships logs to Loki.
#
# The path goes in the __path__ LABEL and targets carries a dummy host.
# Promtail reads targets as host:port to scrape, so a path there makes it
# log "no path for target" and tail nothing while looking healthy.
#
# Failed attempts worth remembering:
#   path in targets         -> treated as a host, silent no-op
#   __path__: true in labels -> became the target KEY, tailed nothing
#   __path__ beside targets  -> not a schema field, config fails to parse
#   __path_exglob__(...)     -> unsupported in this 3.6 build
#
# Each router gets its own job with static lab and device labels rather
# than deriving them from the filename in a template/regex pipeline. The
# pipeline version did attach the lines but never the labels, so every
# dashboard panel filtered on lab= and matched zero streams. Twelve
# explicit entries is verbose and completely predictable.
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: frr-agt-rc1
    static_configs:
      - targets: ['localhost']
        labels:
          __path__: /var/log/lab/frr/agt-rc1/frr.log
          source: frr
          lab: agt
          device: rc1

  - job_name: frr-agt-r1
    static_configs:
      - targets: ['localhost']
        labels:
          __path__: /var/log/lab/frr/agt-r1/frr.log
          source: frr
          lab: agt
          device: r1

  - job_name: frr-agt-r2
    static_configs:
      - targets: ['localhost']
        labels:
          __path__: /var/log/lab/frr/agt-r2/frr.log
          source: frr
          lab: agt
          device: r2

  - job_name: frr-agt-rc2
    static_configs:
      - targets: ['localhost']
        labels:
          __path__: /var/log/lab/frr/agt-rc2/frr.log
          source: frr
          lab: agt
          device: rc2

  - job_name: frr-agt-r3
    static_configs:
      - targets: ['localhost']
        labels:
          __path__: /var/log/lab/frr/agt-r3/frr.log
          source: frr
          lab: agt
          device: r3

  - job_name: frr-agt-r4
    static_configs:
      - targets: ['localhost']
        labels:
          __path__: /var/log/lab/frr/agt-r4/frr.log
          source: frr
          lab: agt
          device: r4

  - job_name: frr-ospf-rc1
    static_configs:
      - targets: ['localhost']
        labels:
          __path__: /var/log/lab/frr/ospf-rc1/frr.log
          source: frr
          lab: ospf
          device: rc1

  - job_name: frr-ospf-r1
    static_configs:
      - targets: ['localhost']
        labels:
          __path__: /var/log/lab/frr/ospf-r1/frr.log
          source: frr
          lab: ospf
          device: r1

  - job_name: frr-ospf-r2
    static_configs:
      - targets: ['localhost']
        labels:
          __path__: /var/log/lab/frr/ospf-r2/frr.log
          source: frr
          lab: ospf
          device: r2

  - job_name: frr-ospf-rc2
    static_configs:
      - targets: ['localhost']
        labels:
          __path__: /var/log/lab/frr/ospf-rc2/frr.log
          source: frr
          lab: ospf
          device: rc2

  - job_name: frr-ospf-r3
    static_configs:
      - targets: ['localhost']
        labels:
          __path__: /var/log/lab/frr/ospf-r3/frr.log
          source: frr
          lab: ospf
          device: r3

  - job_name: frr-ospf-r4
    static_configs:
      - targets: ['localhost']
        labels:
          __path__: /var/log/lab/frr/ospf-r4/frr.log
          source: frr
          lab: ospf
          device: r4

  # The agent live reasoning stream. Bind-mounted from the host so it
  # fills in while the agent works, not only at the end of a run.
  - job_name: agent-live
    static_configs:
      - targets: ['localhost']
        labels:
          __path__: /var/log/lab/agent/agent-run.log
          source: agent-live
          lab: agt
          device: agent

  # Every command the agent ran, from the run bundle, formatted as a log
  # line and labelled by device and by whether it was a config write.
  - job_name: agent-commands
    static_configs:
      - targets: ['localhost']
        labels:
          __path__: /var/log/lab/agent/out/*/trail/06-apply.ndjson
          source: agent-commands
          lab: agt
    pipeline_stages:
      - json:
          expressions:
            node: node
            mode: mode
            rc: rc
            command: command
      - template:
          source: '{{.mode}} {{.node}} rc={{.rc}}: {{.command}}'
      - labels:
          node:
          mode:
      - output:
          source: log
