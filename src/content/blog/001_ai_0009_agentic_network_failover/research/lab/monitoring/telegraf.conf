# Metric collector. The probes run on the HOST (collect.sh) because the
# telegraf image has no docker CLI and cannot drive vtysh. collect.sh writes
# influx line protocol to metrics/lab.influx and telegraf tails that file.
#
# A second telegraf runs per router sharing its network namespace for
# interface counters; those are started from the lab compose files.

[agent]
  interval = "5s"
  round_interval = false
  metric_batch_size = 1000
  collection_jitter = "0s"
  omit_hostname = true

[[inputs.tail]]
  files = ["/lab-metrics/lab.influx"]
  from_beginning = false
  data_format = "influx"

[[outputs.prometheus_client]]
  listen = ":9273"
