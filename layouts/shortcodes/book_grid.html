<style>
  .book-card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); /* Compact and responsive */
    gap: 10px; /* Space between cards */
    padding: 10px;
  }

  .book-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    border: 1px solid #eee;
    border-radius: 5px;
    padding: 10px;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    transition: transform 0.2s;
    height: 200px; /* Fixed height for uniformity */
    overflow: hidden; /* Hide overflow if content is too large */
  }

  .book-card:hover {
    transform: translateY(-5px);
  }

  .book-card img {
    max-width: 100px; /* Max width for image */
    max-height: 150px; /* Max height for image */
    object-fit: contain; /* Ensure image fits without cropping */
    margin-bottom: 5px;
  }
</style>

<div class="book-card-grid">
  {{ range .Site.Data.books }}
    <a href="{{ .url }}" class="book-card" target="_blank" rel="noopener noreferrer" title="View Book">
      <img src="{{ .image }}" alt="Book Cover">
    </a>
  {{ end }}
</div>
