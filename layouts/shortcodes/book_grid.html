<div class="card-grid">
  {{ range .Site.Data.books }}
    <a href="{{ .url }}" class="card" target="_blank" rel="noopener noreferrer" title="View Book">
      <img src="{{ .image }}" alt="Book Cover" class="card-image">
      {{ with .title }}<div class="card-title">{{ . }}</div>{{ end }}
      {{ with .author }}<div class="card-subtitle">{{ . }}</div>{{ end }}
    </a>
  {{ end }}
</div>
