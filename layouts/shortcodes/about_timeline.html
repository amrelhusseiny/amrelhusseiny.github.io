<ul class="timeline-list">
  {{ range .Site.Data.timeline }}
  <li class="timeline-item">
    <div class="timeline-date">{{ .date }}</div>
    <div class="timeline-content">
      <h3>{{ .title }}</h3>
      <p>{{ .company }}</p>
      {{ with .achievement }}
      <p class="timeline-achievement">{{ . }}</p>
      {{ end }}
    </div>
  </li>
  {{ end }}
</ul>
